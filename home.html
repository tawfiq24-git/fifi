<!-- EMOTION SECTION -->

<div class="container">

<h2>Choose Your Emotion</h2>
 

<div class="cards">
<div class="card happy" onclick="openPlayer('happy')">😊 Happy</div>

<div class="card sad" onclick="openPlayer('sad')">😢 Sad</div>

<div class="card relax" onclick="openPlayer('relax')">😌 Relax</div>

<div class="card angry" onclick="openPlayer('angry')">😠 Angry</div>

<div class="card love" onclick="openPlayer('love')">😍 Love</div>

<div class="card energetic" onclick="openPlayer('energetic')">⚡ Energetic</div>

<div class="card focus" onclick="openPlayer('focus')">📚 Focus</div>
</div>

</div>
<div id="musicModal" class="music-modal">

<div class="modal-box">

<span class="close-btn" onclick="closePlayer()">✖</span>

<h3>Select Platform</h3>

<button onclick="playSpotify()">Spotify 🎧</button>
<button onclick="playYouTube()">YouTube ▶️</button>

</div>
